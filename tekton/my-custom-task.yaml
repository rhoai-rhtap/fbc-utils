apiVersion: tekton.dev/v1beta1
kind: Task
metadata:
  name: my-custom-task
spec:
  params:
  - name: username
    type: string
  steps:
    - name: echo
      image: docker.io/library/alpine:latest
      script: |
        #!/bin/bash
        echo "Hello World!!!"
    - name: goodbye
      image: docker.io/library/alpine:latest
      script: |
        #!/bin/bash
        echo "Goodbye $(params.username)!"